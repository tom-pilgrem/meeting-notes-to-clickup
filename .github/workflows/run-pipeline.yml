name: Run meeting-notes-to-clickup pipeline

# GitHub's own `schedule:` cron delivery is unreliable under load (ticks get
# silently dropped, not just delayed), so the primary trigger is an external
# cron service calling the workflow_dispatch REST API hourly. `schedule:` is
# kept as a low-cost backup in case the external pinger has downtime --
# concurrency + the dedup logic in state.py make overlapping/duplicate
# triggers harmless.
#
# The "check" job enforces 9am-5pm Sydney weekdays at runtime for BOTH
# trigger types. Cron itself only understands UTC and can't follow daylight
# saving, so the window is computed against Australia/Sydney local time
# rather than baked into the cron expression. workflow_dispatch does not
# bypass this gate by default -- pass `force: true` (via the Actions UI or
# the API's `inputs`) to run a one-off test outside business hours.
"on":
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run regardless of business hours (manual testing only)"
        type: boolean
        default: false

concurrency:
  group: meeting-notes-to-clickup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced run requested -- skipping business-hours check."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ='Australia/Sydney' date +%H)
          day=$(TZ='Australia/Sydney' date +%u)  # 1=Mon .. 7=Sun
          if [ "$day" -ge 6 ] || [ "$hour" -lt 9 ] || [ "$hour" -gt 17 ]; then
            echo "Outside business hours (Sydney day=$day hour=$hour) -- skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service-account.json
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json run_log.jsonl
          git diff --staged --quiet || git commit -m "Update pipeline state [skip ci]"
          git push
